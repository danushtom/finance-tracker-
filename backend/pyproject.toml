[project]
name = "finance-tracker-backend"
version = "0.1.0"
description = "Finance Tracker API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "motor>=3.6",
    "pymongo>=4.9",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "camelot-py>=0.11",
    "pikepdf>=9.3",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "anthropic>=0.39",
    "google-genai>=0.3",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "structlog>=24.4",
    "tzdata>=2024.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "testcontainers[mongodb]>=4.8",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
