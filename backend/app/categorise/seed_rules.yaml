# Seed rule pack for common Indian merchants (FR-4.11).
# `pattern` is matched against the normalised (uppercased) merchant string.
# `category` / `subcategory` are resolved to ids per-user at seed time
# against that user's seeded category taxonomy.

- pattern: SWIGGY
  match_type: contains
  category: Food
  subcategory: Delivery
