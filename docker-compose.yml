services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { 0 }"
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      - mongo
    restart: "no"
    entrypoint: >
      bash -c "
        until mongosh --host mongo --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; do
          echo 'waiting for mongod...'; sleep 1;
        done;
        mongosh --host mongo --eval '
          try {
            rs.status();
            print(\"replica set already initiated\");
          } catch (e) {
            rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
            print(\"replica set initiated\");
          }
        '
      "

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - ./storage/uploads:/storage/uploads
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ./storage/uploads:/storage/uploads
    command: ["python", "-m", "app.worker.runner"]

  web:
    build:
      context: ./frontend
    env_file: .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  mongo-data:
